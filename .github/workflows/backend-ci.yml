name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Test and verify PostgreSQL startup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/demo
      DB_USER: demo
      DB_PASSWORD: ci-test-password
      PORT: '8080'

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests and package backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify startup and Flyway migrations on PostgreSQL
        run: |
          java -jar target/backend-*.jar > target/backend-smoke.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:$PORT/actuator/health" \
              | jq -e '.status == "UP"'; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat target/backend-smoke.log
          exit 1

      - name: Save backend failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-failure-reports
          path: |
            backend/target/surefire-reports/
            backend/target/backend-smoke.log
          if-no-files-found: ignore
          retention-days: 7
