spring:
  application:
    name: samedesk-backend

  # Values after ":" are local defaults (matching docker-compose.yml).
  # On a server, set DB_URL / DB_USER / DB_PASSWORD as environment variables instead.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/samedesk}
    username: ${DB_USER:samedesk}
    password: ${DB_PASSWORD:samedesk}

  jpa:
    # Flyway owns the schema; Hibernate only checks entities match the tables.
    hibernate:
      ddl-auto: validate
    # Do not keep DB connections open while the JSON response is written.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  websocket:
    # STOMP connection liveness, negotiated with the client; separate from room session heartbeats.
    heartbeat-ms: 10000
  cors:
    # Vite dev server. Add more origins comma-separated, e.g. via CORS_ORIGINS env var.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # On a server, set JWT_SECRET (at least 32 bytes). The default is for local development only:
    # the prod profile has no default, and refuses this value.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: samedesk-backend
    access-ttl-seconds: 900
    refresh-ttl-days: 14
  rate-limit:
    # Limits on the public auth endpoints and on invite-code joins (slows down code guessing),
    # per client IP, per window. Over the limit = 429.
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: 60
    # Header that carries the caller's IP behind a proxy. Empty = use the TCP peer address.
    client-ip-header: ""
    # Brackets keep the "/" characters in the map keys (Spring drops them otherwise).
    limits:
      "[/api/v1/auth/login]": 10
      "[/api/v1/auth/register]": 5
      "[/api/v1/auth/refresh]": 30
      "[/api/v1/auth/logout]": 30
      "[/api/v1/rooms/join-by-code]": 10
  room-sessions:
    # No heartbeat for this long = connection lost, the session is closed (reason TIMEOUT).
    # Shared with D's real-time side: change it only together with D.
    timeout-seconds: ${ROOM_SESSION_TIMEOUT_SECONDS:60}
    # How often the background job looks for timed-out sessions.
    sweep-interval-ms: 15000
  timer:
    # How long a timer command id is remembered, so a retried command is not applied twice.
    command-retention-hours: 24
    # How often old command ids are deleted.
    cleanup-interval-ms: 3600000
  points:
    # Points for every minute of a focus block that runs out by itself.
    per-focus-minute: 1
    # Extra points for a finished block, by preset. 25-5 = 25 points, 50-10 = 60, 90-15 = 115.
    block-bonus:
      "25-5": 0
      "50-10": 10
      "90-15": 25
    # Time zone that decides where "today" starts in GET /points/me.
    day-zone: Europe/Istanbul
