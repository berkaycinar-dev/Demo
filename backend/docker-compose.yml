# Local PostgreSQL for development.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept in the volume)
#   Reset:  docker compose down -v     (deletes all data)
services:
  db:
    image: postgres:16
    container_name: demo-db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  demo-db-data:
