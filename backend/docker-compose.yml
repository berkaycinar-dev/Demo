# Local PostgreSQL for development.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (data is kept in the volume)
#   Reset:  docker compose down -v     (deletes all data)
services:
  db:
    image: postgres:16
    container_name: samedesk-db
    environment:
      POSTGRES_DB: samedesk
      POSTGRES_USER: samedesk
      POSTGRES_PASSWORD: samedesk
    ports:
      - "5432:5432"
    volumes:
      - samedesk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samedesk -d samedesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  samedesk-db-data:
