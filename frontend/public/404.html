<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sayfa bulunamadı · Odakhane</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sunucuda olmayan bir yol açılınca (ör. /eski-sayfa) gösterilir. Uygulamanın içindeki bilinmeyen
         adresler (#yanlis) src/site/NotFoundPage.jsx ile karşılanır. Stil kendi içinde: uygulama yüklenmez. -->
    <style>
      :root { color-scheme: light dark; --bg: #efe9df; --card: #fffdf9; --text: #2b2520; --muted: #6b6158; --fill: #a24526; --on: #fff8f2; }
      @media (prefers-color-scheme: dark) { :root { --bg: #24211e; --card: #302c28; --text: #efe9e1; --muted: #b3a99c; } }
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100svh; margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, 'Segoe UI', Roboto, sans-serif; }
      main { display: grid; gap: 14px; justify-items: start; max-width: 440px; padding: 32px 28px; border-radius: 20px; background: var(--card); box-shadow: 0 10px 24px -14px rgba(60, 40, 20, 0.3); }
      svg { width: 48px; height: 48px; }
      h1 { margin: 0; font-size: 26px; line-height: 1.2; }
      p { margin: 0; color: var(--muted); }
      a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 6px; padding: 0 20px; border-radius: 12px; background: var(--fill); color: var(--on); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--fill); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2.5 25 8.5 14 14.5 3 8.5Z" fill="#e3a47f" /><path d="M3 8.5 14 14.5V26.5L3 20.5Z" fill="#b5502d" /><path d="M25 8.5 14 14.5V26.5L25 20.5Z" fill="#7d3519" /><path d="M6.5 14.4 10.5 16.6V24.6L6.5 22.4Z" fill="#ffd89a" /></svg>
      <h1>Bu oda boş</h1>
      <p>Aradığın sayfa burada yok. Bağlantı eski ya da yanlış yazılmış olabilir.</p>
      <a href="/">Odakhane’ye dön</a>
    </main>
  </body>
</html>
