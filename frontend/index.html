<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2c2824" media="(prefers-color-scheme: dark)" />
    <title>SameDesk</title>
    <!-- Açık / koyu mod ilk boyamadan önce: useColorMode.js ile aynı kural (kayıt yoksa sistem). -->
    <script>
      (function () {
        var p = null
        try { p = localStorage.getItem('samedesk-mode') } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
        if (dark) document.documentElement.setAttribute('data-mode', 'dark')
      })()
    </script>
    <meta name="description" content="Kamerasız birlikte çalışma odaları: avatarınla bir odaya otur, pomodoro sayacını başlat, başkalarıyla aynı odada odaklan." />
    <!-- paylaşım önizlemesi: görsel scripts/render-brand-assets.mjs ile üretilir. Adresler tam yazılır
         (bazı platformlar göreli yolu okumaz); alan adı değişirse buradaki dört adres de değişir. -->
    <link rel="canonical" href="https://samedesk.vercel.app/" />
    <meta property="og:url" content="https://samedesk.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SameDesk" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="SameDesk · Birlikte çalışınca odaklanmak kolaylaşır" />
    <meta property="og:description" content="Kamerasız, sessiz, birlikte: avatarınla bir odaya otur, sayacını başlat." />
    <meta property="og:image" content="https://samedesk.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SameDesk: akşam ışığında izometrik kütüphane odası ve “Birlikte çalışınca odaklanmak kolaylaşır.” başlığı" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://samedesk.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
