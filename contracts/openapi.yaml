openapi: 3.0.3
info:
  title: Demo API
  version: 0.1.0
  description: |
    REST contract for the Demo backend. Owner: C (backend business logic).

    Workflow for every new endpoint:
      1. Add it here first and open a PR (frontend can start against this file).
      2. Implement it in backend/ with unit tests.
      3. Add a matching request to backend/bruno/.

    Conventions:
      * All paths start with /api/v1
      * JSON field names are camelCase
      * Times are ISO-8601 UTC strings, e.g. 2026-10-29T20:00:00Z
      * Every error uses the ErrorResponse shape below
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
    description: Health and diagnostics
  - name: auth
    description: |
      Accounts and tokens. DRAFT for review by D and A; decisions below are proposals until merged.

      **Access token.** Signed JWT (HS256), valid 15 minutes. Claims: `iss` = `demo-backend`,
      `sub` = user id (UUID), `iat`, `exp`, `jti`, `username`. No roles inside the token:
      room roles are looked up on the server (room membership), so a role change applies at once.

      **How it is sent.** REST: `Authorization: Bearer <accessToken>`. STOMP: the same value in the
      CONNECT frame's `Authorization` header (never in the URL). No cookies.

      **Refresh token.** Opaque random value (not a JWT), valid 14 days, stored only as a hash,
      replaced on every use. Reusing an already-used refresh token revokes all refresh tokens of that user.

      **Revocation.** Logout revokes the refresh token. Access tokens are not blacklisted; they end by
      themselves within 15 minutes.

      **Validation on the server.** One Spring app, so D's STOMP interceptor uses the same `JwtDecoder`
      bean that C exposes; there is no second auth system. The signing key comes from the `JWT_SECRET`
      environment variable (at least 32 bytes).
  - name: rooms
    description: |
      Study rooms and who belongs to them. DRAFT for review by D and A.

      **Visibility.** `PUBLIC` rooms are listed for everyone who is signed in. `PRIVATE` rooms are not
      listed and need the invite code to join. For a user who is not a member, a private room looks
      like it does not exist (404 `ROOM_NOT_FOUND`), so ids cannot be probed.

      **Roles (room membership, not in the JWT).** `OWNER` (exactly one per room, the creator) and `MEMBER`.
      The owner sees the invite code; members do not. Roles are read from the database on every check,
      so a change applies at once. D's STOMP checks call `RoomAccessChecker` (`isMember`, `roleOf`).

      **Capacity.** `maxMembers` is 2 to 10 (default 8). Joining a full room gives 409 `ROOM_FULL`.

      **Events.** On a first join the server publishes `MEMBER_JOINED` through `RoomEventPublisher`
      with payload `{roomId, userId, username, role}`. When a member gives up membership (`leave`) it
      publishes `MEMBER_LEFT` with the same payload. Events are published after the database commit,
      so a rolled-back change is never announced.

      **Sessions (H4).** Membership says who belongs to a room; a session says who is inside it now.
      A member opens a session (`POST .../sessions`), keeps it alive with heartbeats
      (`POST .../sessions/current/heartbeat`, every 15 to 20 seconds is fine) and closes it
      (`DELETE .../sessions/current`). If no heartbeat arrives for 60 seconds the server closes the
      session by itself (end reason `TIMEOUT`, time after the last heartbeat is not counted).
      Every session is kept as a row; time spent and points are computed from them.
      `RoomAccessChecker.hasActiveSession` tells D's real-time side whether a user is inside a room.

  - name: timer
    description: |
      The signed-in user's personal Pomodoro timer. The server is the source of truth; clients show it and
      send commands. The server does not tick: it stores the end time (`endsAt`) and works out the rest
      when the timer is read or a command arrives.

      **State.** `status` is `IDLE`, `RUNNING` or `PAUSED`. `phase` is `FOCUS` or `BREAK`. `IDLE` always means
      a fresh `FOCUS` block is ready. `remainingSeconds` is the time left now. `endsAt` is set only while
      `RUNNING`. `serverTime` lets a client correct clock drift. Presets: `25-5`, `50-10`, `90-15`
      (focus minutes - break minutes).

      **Phases follow each other.** While the user is around, a finished `FOCUS` starts the `BREAK` and a
      finished `BREAK` starts the next `FOCUS`, counted from the exact end time (no drift). If the next phase
      has also ended already (nobody was there), the timer goes back to `IDLE` and waits for a new start.
      Each `FOCUS` that ends by running out increments `completedFocusBlocks`. A skipped block does not count.

      **Commands.** `START` (from `IDLE`), `PAUSE` (from `RUNNING`), `RESUME` (from `PAUSED`), `SKIP`
      (from `RUNNING` or `PAUSED`; the next phase starts at once, nothing is counted), `RESET` (from anywhere,
      back to `IDLE`), `SET_PRESET` (from anywhere; also resets to `IDLE`). Every command carries:
      `commandId`, a new UUID per user action, and `expectedVersion`, the `version` the client last saw.
      A wrong `expectedVersion` gives 409 `STALE_VERSION`: read the timer again and decide. Sending the same
      `commandId` again (a retry after a lost response) changes nothing and returns the result of the first
      time; no event is published twice. Command ids are remembered for 24 hours.

      **Events.** Published through `RoomEventPublisher`, after the database commit, to every room where the
      user has an open session (none if the user is in no room). Payload:
      `{userId, preset, phase, endsAt, remainingSeconds, version, occurredAt}`.
      `TIMER_STARTED` (start, resume, skip; `phase` is the phase now running), `TIMER_PAUSED`,
      `TIMER_RESET` (reset, set preset), `TIMER_FINISHED` (a phase ran out; `phase` is the phase that ended,
      `endsAt` is when it ended, `remainingSeconds` is 0). A client can compare `endsAt` with the time it
      received the event to tell a live finish from one found late.

  - name: points
    description: |
      Points the signed-in user has earned. Points come from the timer and are never edited by clients.

      **What earns points.** A `FOCUS` block that runs out by itself. A skipped or reset block earns nothing.
      One finished block is credited exactly once, even if it is found late (the timer settles it when it is
      next read) or a request is retried.

      **How many.** `basePoints` = focus minutes x 1. `bonusPoints` depends on the preset: `25-5` gives 0,
      `50-10` gives 10, `90-15` gives 25. So one block earns 25, 60 or 115 points. The numbers are server
      settings (`app.points`), not part of the contract; clients read `points`, `basePoints` and `bonusPoints`
      from the responses.

      **Who is eligible.** The user must have had an open room session at the moment the block ended (inside
      a room, see `rooms`). A block that ended while the user was in no room earns nothing; the timer still
      counts it in `completedFocusBlocks`. Eligibility sits behind one interface on the server, so the
      later "at the desk" rule can replace it without changing this contract.

      **Today.** `todayPoints` counts the current day in the server's time zone (default `Europe/Istanbul`).
      Points are kept for good; no row is deleted.

paths:
  /api/v1/ping:
    get:
      tags: [system]
      operationId: ping
      summary: Check that the API is up (goes through controller and service)
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              example:
                message: pong
                serverTime: "2026-10-29T20:00:00Z"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created. Tokens are returned, so the client is signed in at once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email or username is already taken, or the password is longer than 72 bytes (`code` is EMAIL_TAKEN, USERNAME_TAKEN or PASSWORD_TOO_LONG).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Business rule violated
                detail: Email is already registered
                code: EMAIL_TAKEN

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: |
            Wrong email or password (`code` is INVALID_CREDENTIALS). The answer is the same for an
            unknown email and a wrong password, so it does not reveal which accounts exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                title: Unauthorized
                detail: Email or password is wrong
                code: INVALID_CREDENTIALS

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Return the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user the access token belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: The old refresh token stops working after this call. Using an already-used token again revokes all refresh tokens of that user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token and new refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Refresh token is unknown, expired or already used (`code` is REFRESH_TOKEN_INVALID).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 401
                title: Unauthorized
                detail: Refresh token is not valid
                code: REFRESH_TOKEN_INVALID

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token
      description: Always answers 204, even for an unknown token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token revoked (or it never existed)

  /api/v1/rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      description: |
        `scope=PUBLIC` (default): all public rooms, newest first.
        `scope=MINE`: rooms the signed-in user belongs to (public and private).
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [PUBLIC, MINE]
            default: PUBLIC
      responses:
        "200":
          description: Rooms (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room
      description: The caller becomes the `OWNER` and the first member. A private room gets an invite code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get one room
      description: Public rooms are visible to everyone signed in. Private rooms only to their members.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: The room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RoomNotFound"

  /api/v1/rooms/{roomId}/join:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: Join a room
      description: |
        Public room: no body needed. Private room: send the invite code. Joining a room you already
        belong to is allowed and changes nothing (200). A wrong or missing invite code gives 404,
        the same as an unknown room.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: The caller is now a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: Room is full (`code` is ROOM_FULL).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Business rule violated
                detail: Room is full
                code: ROOM_FULL

  /api/v1/rooms/{roomId}/leave:
    post:
      tags: [rooms]
      operationId: leaveRoom
      summary: Give up membership of a room
      description: |
        Removes the caller from the room, closes their open session (end reason `LEFT_ROOM`) and
        publishes `MEMBER_LEFT`. The `OWNER` cannot leave (409 `OWNER_CANNOT_LEAVE`). Leaving a public
        room you are not in changes nothing (204). A private room you are not in looks unknown (404).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: The caller is no longer a member
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: The caller is the owner (`code` is OWNER_CANNOT_LEAVE).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Business rule violated
                detail: The owner cannot leave the room.
                code: OWNER_CANNOT_LEAVE

  /api/v1/rooms/{roomId}/sessions:
    post:
      tags: [rooms]
      operationId: enterRoom
      summary: Enter a room (open a session)
      description: |
        Members only. If the caller already has an open session in this room it is kept and refreshed,
        so a page reload does not create a second one. A private room is 404 for non-members;
        a public room answers 409 `NOT_A_MEMBER` (join it first).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: The open session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: The caller is not a member of this public room (`code` is NOT_A_MEMBER).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Business rule violated
                detail: Join the room before entering it.
                code: NOT_A_MEMBER

  /api/v1/rooms/{roomId}/sessions/current/heartbeat:
    post:
      tags: [rooms]
      operationId: heartbeatSession
      summary: Keep the open session alive
      description: |
        Send it every 15 to 20 seconds while the user is in the room. After 60 seconds without one
        the session is closed by the server. If that happened, this call answers 404
        `SESSION_NOT_FOUND` and the client should enter the room again.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Session refreshed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The caller has no open session in this room (`code` is SESSION_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 404
                title: Not found
                detail: No open session in this room.
                code: SESSION_NOT_FOUND

  /api/v1/rooms/{roomId}/sessions/current:
    delete:
      tags: [rooms]
      operationId: exitRoom
      summary: Exit a room (close the open session)
      description: Calling it with no open session is allowed and changes nothing (204).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: No open session remains
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/rooms/{roomId}/sessions/active:
    get:
      tags: [rooms]
      operationId: listActiveMembers
      summary: Who is inside the room now
      description: |
        People with an open session, the longest-inside first. Members only
        (same 404 / 409 rules as entering).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: People inside the room
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveMemberResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/RoomNotFound"
        "409":
          description: The caller is not a member of this public room (`code` is NOT_A_MEMBER).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Business rule violated
                detail: Join the room before entering it.
                code: NOT_A_MEMBER

  /api/v1/timer:
    get:
      tags: [timer]
      operationId: getTimer
      summary: Read the caller's timer
      description: |
        Creates an idle timer (preset `25-5`) the first time. If a phase has run out since the last
        call, it is settled first (phase change, `completedFocusBlocks`, events).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerStateResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/timer/commands:
    post:
      tags: [timer]
      operationId: sendTimerCommand
      summary: Change the caller's timer
      description: See the "timer" tag for the commands, `commandId` and `expectedVersion`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimerCommandRequest"
      responses:
        "200":
          description: The timer after the command (or the first result, for a repeated `commandId`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerStateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: |
            `code` is `STALE_VERSION` (the timer changed; read it again), `INVALID_TIMER_TRANSITION`
            (the command does not fit the current status) or `INVALID_PRESET` (unknown preset, or
            `SET_PRESET` without one).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 409
                title: Business rule violated
                detail: The timer changed. Read it again.
                code: STALE_VERSION

  /api/v1/points/me:
    get:
      tags: [points]
      operationId: getMyPoints
      summary: Totals of the caller's points
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Totals (zero for a user who has earned nothing yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSummaryResponse"
              example:
                totalPoints: 170
                todayPoints: 60
                completedBlocks: 3
                focusSeconds: 6000
                serverTime: "2026-11-10T13:00:55Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/points/me/events:
    get:
      tags: [points]
      operationId: listMyPointEvents
      summary: History of the caller's points, newest first
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Zero-based page number. Below 0 is treated as 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Items per page. Out-of-range values are clamped into 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of point events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointEventPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from register, login or refresh.

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    RoomNotFound:
      description: Room does not exist, or it is private and the caller is not a member (`code` is ROOM_NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 404
            title: Not found
            detail: Room not found
            code: ROOM_NOT_FOUND
    ValidationError:
      description: Request body failed validation (`code` is VALIDATION_ERROR, see `fieldErrors`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 400
            title: Validation error
            detail: Request validation failed
            code: VALIDATION_ERROR
            fieldErrors:
              password: size must be between 8 and 72
    Unauthenticated:
      description: Missing, malformed or expired access token (`code` is UNAUTHENTICATED).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: 401
            title: Unauthorized
            detail: Access token is missing or expired
            code: UNAUTHENTICATED

  schemas:
    PingResponse:
      type: object
      required: [message, serverTime]
      properties:
        message:
          type: string
          example: pong
        serverTime:
          type: string
          format: date-time
          description: Server's current time (UTC). Clients may use it to correct clock drift for timers.

    ErrorResponse:
      type: object
      description: |
        Shared error body (RFC 9457 problem details). Returned with 4xx/5xx statuses.
        Frontend should branch on `code`, not on `detail` text.
      required: [status, title, code]
      properties:
        status:
          type: integer
          example: 409
        title:
          type: string
          example: Business rule violated
        detail:
          type: string
          example: Room is full
        code:
          type: string
          description: Stable machine-readable error code
          example: ROOM_FULL
        fieldErrors:
          type: object
          description: Only for VALIDATION_ERROR. Field name -> message.
          additionalProperties:
            type: string
          example:
            name: must not be blank

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored in lower case. Must be unique.
          example: ada@example.com
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{3,30}$"
          description: 3-30 letters, digits or underscore. Unique ignoring case.
          example: ada_l
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: At most 72 characters (the limit of the password hash).

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UserResponse:
      type: object
      required: [id, email, username, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken, tokenType, expiresIn]
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
        accessToken:
          type: string
          description: "JWT. Send it as the header `Authorization: Bearer <accessToken>`."
        refreshToken:
          type: string
          description: Opaque value. Keep it safe; it is valid 14 days and works once.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    RoomVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]

    RoomRole:
      type: string
      enum: [OWNER, MEMBER]

    CreateRoomRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Algoritma çalışma odası
        description:
          type: string
          maxLength: 200
        visibility:
          $ref: "#/components/schemas/RoomVisibility"
          default: PUBLIC
        maxMembers:
          type: integer
          minimum: 2
          maximum: 10
          default: 8

    JoinRoomRequest:
      type: object
      properties:
        inviteCode:
          type: string
          description: Needed only for private rooms.

    RoomResponse:
      type: object
      required: [id, name, visibility, maxMembers, memberCount, ownerId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          $ref: "#/components/schemas/RoomVisibility"
        maxMembers:
          type: integer
        memberCount:
          type: integer
        ownerId:
          type: string
          format: uuid
        myRole:
          allOf:
            - $ref: "#/components/schemas/RoomRole"
          nullable: true
          description: The caller's role, or null if the caller is not a member.
        inviteCode:
          type: string
          nullable: true
          description: Only for the OWNER of a private room, otherwise null.
        createdAt:
          type: string
          format: date-time

    RoomSessionResponse:
      type: object
      required: [id, roomId, startedAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Time of the last heartbeat (or of entering).

    ActiveMemberResponse:
      type: object
      required: [userId, username, role, startedAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/RoomRole"
        startedAt:
          type: string
          format: date-time
          description: When this person entered the room.

    TimerPhase:
      type: string
      enum: [FOCUS, BREAK]

    TimerStatus:
      type: string
      enum: [IDLE, RUNNING, PAUSED]

    TimerCommandType:
      type: string
      enum: [START, PAUSE, RESUME, SKIP, RESET, SET_PRESET]

    TimerStateResponse:
      type: object
      required: [preset, phase, status, remainingSeconds, totalSeconds, version, completedFocusBlocks, serverTime]
      properties:
        preset:
          type: string
          enum: ["25-5", "50-10", "90-15"]
        phase:
          $ref: "#/components/schemas/TimerPhase"
        status:
          $ref: "#/components/schemas/TimerStatus"
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: When the running phase ends. Null unless `status` is RUNNING.
        remainingSeconds:
          type: integer
          description: Seconds left in the current phase, as of `serverTime`.
        totalSeconds:
          type: integer
          description: Length of the current phase.
        version:
          type: integer
          format: int64
          description: Goes up by one on every change. Send it back as `expectedVersion`.
        completedFocusBlocks:
          type: integer
          description: Focus blocks that ended by running out, since the timer was created.
        serverTime:
          type: string
          format: date-time

    TimerCommandRequest:
      type: object
      required: [commandId, expectedVersion, type]
      properties:
        commandId:
          type: string
          format: uuid
          description: A new UUID for every user action. Reuse it only to retry the same action.
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        type:
          $ref: "#/components/schemas/TimerCommandType"
        preset:
          type: string
          enum: ["25-5", "50-10", "90-15"]
          description: Needed only for SET_PRESET.

    PointKind:
      type: string
      enum: [FOCUS_BLOCK]
      description: Why the points were given. Only a finished focus block for now.

    PointSummaryResponse:
      type: object
      required: [totalPoints, todayPoints, completedBlocks, focusSeconds, serverTime]
      properties:
        totalPoints:
          type: integer
          format: int64
        todayPoints:
          type: integer
          format: int64
          description: Points earned today, in the server's time zone.
        completedBlocks:
          type: integer
          format: int64
          description: Focus blocks that earned points (not the same as the timer's `completedFocusBlocks`).
        focusSeconds:
          type: integer
          format: int64
          description: Total focus time of the blocks that earned points.
        serverTime:
          type: string
          format: date-time

    PointEventResponse:
      type: object
      required: [id, kind, points, basePoints, bonusPoints, focusSeconds, preset, earnedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PointKind"
        points:
          type: integer
          description: basePoints + bonusPoints
        basePoints:
          type: integer
        bonusPoints:
          type: integer
        focusSeconds:
          type: integer
          description: Length of the focus block.
        preset:
          type: string
          enum: ["25-5", "50-10", "90-15"]
        earnedAt:
          type: string
          format: date-time
          description: When the focus block ended (not when the server found out).

    PointEventPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PointEventResponse"
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
